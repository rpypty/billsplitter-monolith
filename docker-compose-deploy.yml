version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: billsplitter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: bill_splitter
    ports:
      - "55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bill_splitter"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: billsplitter-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5001:5001"
    command: >
      sh -c "
        sed -i 's@localhost:55433@postgres:5432@g' /opt/app/config.yml &&
        /opt/app/billsplitter
      "

volumes:
  pgdata:
