basePath: /
definitions:
  billsplitter-monolith_internal_domain_user.ExtraInfo:
    properties:
      telegram_id:
        type: integer
    type: object
  billsplitter-monolith_internal_domain_user.User:
    properties:
      extra:
        $ref: '#/definitions/billsplitter-monolith_internal_domain_user.ExtraInfo'
      firstName:
        type: string
      id:
        type: integer
      lastName:
        type: string
      username:
        type: string
    type: object
  billsplitter-monolith_internal_utils_http.ErrorResponse:
    properties:
      errorMessage:
        type: string
    type: object
  billsplitter-monolith_internal_utils_http.ResponseID:
    properties:
      ID:
        type: integer
    type: object
  billsplitter-monolith_internal_utils_http.ResponseOK:
    properties:
      message:
        type: string
    type: object
  internal_transport_http_auth.LoginTelegramReq:
    properties:
      firstName:
        example: John
        type: string
      lastName:
        example: Doe
        type: string
      telegramID:
        example: 123456789
        type: integer
      username:
        example: johndoe
        type: string
    required:
    - telegramID
    type: object
  internal_transport_http_auth.LoginTelegramRes:
    properties:
      sessionID:
        example: b42b0a8e-0d1f-4c3d-939f-85fbbdc9be62
        type: string
      userInfo:
        $ref: '#/definitions/billsplitter-monolith_internal_domain_user.User'
    type: object
  internal_transport_http_auth.MeRes:
    properties:
      user:
        $ref: '#/definitions/billsplitter-monolith_internal_domain_user.User'
    type: object
  internal_transport_http_bill.Bill:
    properties:
      created_at:
        type: string
      created_by_user_id:
        type: integer
      currency:
        type: string
      deleted_at:
        type: string
      event_id:
        type: integer
      id:
        type: integer
      name:
        type: string
      paid_by:
        type: integer
      participants:
        items:
          $ref: '#/definitions/internal_transport_http_bill.Participant'
        type: array
      split_type:
        type: string
      total_amount:
        type: integer
      updated_at:
        type: string
    type: object
  internal_transport_http_bill.CreateBillRq:
    properties:
      currency:
        type: string
      event_id:
        type: integer
      name:
        type: string
      paid_by:
        type: integer
      participants:
        items:
          $ref: '#/definitions/internal_transport_http_bill.ParticipantRq'
        type: array
      split_type:
        type: string
      total_amount:
        type: integer
    type: object
  internal_transport_http_bill.Participant:
    properties:
      amount:
        type: integer
      member_id:
        type: integer
    type: object
  internal_transport_http_bill.ParticipantRq:
    properties:
      amount:
        type: integer
      member_id:
        type: integer
    type: object
  internal_transport_http_meet.Balance:
    properties:
      balance:
        type: integer
      member_id:
        type: integer
      name:
        type: string
      total_paid:
        type: integer
      total_share:
        type: integer
      user_id:
        type: integer
    type: object
  internal_transport_http_meet.CreateEventRq:
    properties:
      date:
        type: string
      members:
        items:
          type: string
        type: array
      name:
        type: string
    type: object
  internal_transport_http_meet.Event:
    properties:
      ID:
        type: integer
      created_at:
        type: string
      created_by_user_id:
        type: integer
      deleted_at:
        type: string
      event_date:
        type: string
      members:
        items:
          $ref: '#/definitions/internal_transport_http_meet.Member'
        type: array
      name:
        type: string
      status:
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
  internal_transport_http_meet.EventSummary:
    properties:
      balances:
        items:
          $ref: '#/definitions/internal_transport_http_meet.Balance'
        type: array
      settlements:
        items:
          $ref: '#/definitions/internal_transport_http_meet.Settlement'
        type: array
    type: object
  internal_transport_http_meet.Member:
    properties:
      ID:
        type: integer
      user_id:
        type: integer
      username:
        type: string
    type: object
  internal_transport_http_meet.SelectMemberRq:
    properties:
      member_id:
        type: integer
    type: object
  internal_transport_http_meet.Settlement:
    properties:
      amount:
        type: integer
      from_member_id:
        type: integer
      to_member_id:
        type: integer
    type: object
  internal_transport_http_user.CreatePaymentMethodReq:
    properties:
      description:
        example: Система быстрых платежей
        type: string
      name:
        example: СБП
        type: string
      recipient:
        example: "+79001234567"
        type: string
    required:
    - name
    - recipient
    type: object
  internal_transport_http_user.PaymentMethodResponse:
    properties:
      description:
        example: Система быстрых платежей
        type: string
      id:
        example: 1
        type: integer
      name:
        example: СБП
        type: string
      recipient:
        example: "+79001234567"
        type: string
      userId:
        example: 123
        type: integer
    type: object
  internal_transport_http_user.PaymentMethodsResponse:
    properties:
      paymentMethods:
        items:
          $ref: '#/definitions/internal_transport_http_user.PaymentMethodResponse'
        type: array
    type: object
  internal_transport_http_user.UpdatePaymentMethodReq:
    properties:
      description:
        example: Система быстрых платежей
        type: string
      name:
        example: СБП
        type: string
      recipient:
        example: "+79001234567"
        type: string
    required:
    - name
    - recipient
    type: object
  internal_transport_http_user.UpdateUserProfileReq:
    properties:
      firstName:
        example: John
        type: string
      lastName:
        example: Doe
        type: string
      username:
        example: johndoe
        type: string
    type: object
host: localhost:5001
info:
  contact: {}
  description: API для Telegram Mini App по разделению счетов
  title: BillSplitter API
  version: "1.0"
paths:
  /auth/login/telegram:
    post:
      consumes:
      - application/json
      description: Создаёт или получает пользователя по Telegram ID и возвращает sessionID
      parameters:
      - description: Данные пользователя из Telegram
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_transport_http_auth.LoginTelegramReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transport_http_auth.LoginTelegramRes'
        "400":
          description: Некорректный запрос
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "500":
          description: Internal Server Error, но в debug моде возвращает детали ошибки
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
      summary: Авторизация через Telegram
      tags:
      - auth
  /auth/me:
    get:
      description: Возвращает данные пользователя, извлечённые по sessionID из контекста
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transport_http_auth.MeRes'
        "400":
          description: Пользователь не найден или сессия невалидна
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
      security:
      - SessionAuth: []
      summary: Получить данные текущего пользователя
      tags:
      - auth
  /bills:
    get:
      consumes:
      - application/json
      parameters:
      - description: ID ивента
        in: query
        name: event_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_transport_http_bill.Bill'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
      security:
      - SessionAuth: []
      summary: Получить список чеков ивента
      tags:
      - bill
    post:
      consumes:
      - application/json
      description: Чек создается от имени пользователя из сессии
      parameters:
      - description: Данные чека
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_transport_http_bill.CreateBillRq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ResponseID'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
      security:
      - SessionAuth: []
      summary: Создает чек внутри ивента
      tags:
      - bill
  /meets:
    get:
      consumes:
      - application/json
      description: ID юзера берется из сессии
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_transport_http_meet.Event'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
      security:
      - SessionAuth: []
      summary: Получение персонального списка ивентов
      tags:
      - meet
    post:
      consumes:
      - application/json
      description: Создает новый мит с участниками
      parameters:
      - description: Данные мита
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_transport_http_meet.CreateEventRq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ResponseID'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
      security:
      - SessionAuth: []
      summary: Создает новый мит
      tags:
      - meet
  /meets/{id}:
    get:
      consumes:
      - application/json
      parameters:
      - description: ID мита
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transport_http_meet.EventSummary'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
      security:
      - SessionAuth: []
      summary: Получение инфы по ивенту
      tags:
      - meet
  /meets/{id}/assign:
    put:
      consumes:
      - application/json
      description: user_id берется из сессии
      parameters:
      - description: ID мита
        in: path
        name: id
        required: true
        type: integer
      - description: member_id
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_transport_http_meet.SelectMemberRq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ResponseOK'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
      security:
      - SessionAuth: []
      summary: Связать участника с текущим пользователем
      tags:
      - meet
  /meets/{id}/summary:
    get:
      consumes:
      - application/json
      parameters:
      - description: ID мита
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transport_http_meet.EventSummary'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
      security:
      - SessionAuth: []
      summary: Получение сбивки по ивенту
      tags:
      - meet
  /payment_methods:
    get:
      consumes:
      - application/json
      description: Возвращает список всех платежных методов пользователя
      produces:
      - application/json
      responses:
        "200":
          description: Список платежных методов
          schema:
            $ref: '#/definitions/internal_transport_http_user.PaymentMethodsResponse'
        "400":
          description: Некорректный запрос или ошибка сессии
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "403":
          description: Доступ запрещён (несовпадение ID пользователя и сессии)
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
      security:
      - SessionAuth: []
      summary: Получение списка платежных методов
      tags:
      - user
    post:
      consumes:
      - application/json
      description: Создает новый платежный метод для пользователя
      parameters:
      - description: Данные для создания платежного метода
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_transport_http_user.CreatePaymentMethodReq'
      produces:
      - application/json
      responses:
        "201":
          description: Платежный метод успешно создан
          schema:
            $ref: '#/definitions/internal_transport_http_user.PaymentMethodResponse'
        "400":
          description: Некорректный запрос или ошибка сессии
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "403":
          description: Доступ запрещён (несовпадение ID пользователя и сессии)
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
      security:
      - SessionAuth: []
      summary: Создание платежного метода
      tags:
      - user
  /payment_methods/{methodId}:
    delete:
      consumes:
      - application/json
      description: Удаляет платежный метод пользователя
      parameters:
      - description: ID платежного метода
        in: path
        name: methodId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Платежный метод успешно удалён
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ResponseOK'
        "400":
          description: Некорректный запрос или ошибка сессии
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "403":
          description: Доступ запрещён (несовпадение ID пользователя и сессии)
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
      security:
      - SessionAuth: []
      summary: Удаление платежного метода
      tags:
      - user
    put:
      consumes:
      - application/json
      description: Обновляет существующий платежный метод пользователя
      parameters:
      - description: ID платежного метода
        in: path
        name: methodId
        required: true
        type: integer
      - description: Данные для обновления платежного метода
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_transport_http_user.UpdatePaymentMethodReq'
      produces:
      - application/json
      responses:
        "200":
          description: Платежный метод успешно обновлён
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ResponseOK'
        "400":
          description: Некорректный запрос или ошибка сессии
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "403":
          description: Доступ запрещён (несовпадение ID пользователя и сессии)
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
      security:
      - SessionAuth: []
      summary: Обновление платежного метода
      tags:
      - user
  /user/{id}/payment_methods:
    get:
      consumes:
      - application/json
      description: Возвращает список всех платежных методов пользователя
      parameters:
      - description: ID пользователя (опционально, если не указан - берется из сессии)
        in: path
        name: id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Список платежных методов
          schema:
            $ref: '#/definitions/internal_transport_http_user.PaymentMethodsResponse'
        "400":
          description: Некорректный запрос или ошибка сессии
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "403":
          description: Доступ запрещён (несовпадение ID пользователя и сессии)
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
      security:
      - SessionAuth: []
      summary: Получение списка платежных методов
      tags:
      - user
    post:
      consumes:
      - application/json
      description: Создает новый платежный метод для пользователя
      parameters:
      - description: ID пользователя (опционально, если не указан - берется из сессии)
        in: path
        name: id
        type: integer
      - description: Данные для создания платежного метода
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_transport_http_user.CreatePaymentMethodReq'
      produces:
      - application/json
      responses:
        "201":
          description: Платежный метод успешно создан
          schema:
            $ref: '#/definitions/internal_transport_http_user.PaymentMethodResponse'
        "400":
          description: Некорректный запрос или ошибка сессии
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "403":
          description: Доступ запрещён (несовпадение ID пользователя и сессии)
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
      security:
      - SessionAuth: []
      summary: Создание платежного метода
      tags:
      - user
  /user/{id}/payment_methods/{methodId}:
    delete:
      consumes:
      - application/json
      description: Удаляет платежный метод пользователя
      parameters:
      - description: ID пользователя (опционально, если не указан - берется из сессии)
        in: path
        name: id
        type: integer
      - description: ID платежного метода
        in: path
        name: methodId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Платежный метод успешно удалён
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ResponseOK'
        "400":
          description: Некорректный запрос или ошибка сессии
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "403":
          description: Доступ запрещён (несовпадение ID пользователя и сессии)
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/billsplitter-monolith_internal_utils_http.ErrorResponse'
      security:
      - SessionAuth: []
      summary: Удаление платежного метода
      tags:
      - user
    put:
      consumes:
      - application/json
